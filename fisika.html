px;border-top:1px solid var(--line)}.chapter-body h3{font-size:1rem;margin:17px 0 5px;color:var(--accent)}.chapter-body p,.chapter-body li{font-size:.91rem}.formula{background:#f0f7f3;padding:12px 15px;border-left:3px solid var(--accent);border-radius:7px;margin:12px 0;font-family:Georgia,serif}.quiz{margin-top:20px;padding:17px;background:#f8fbf9;border:1px solid #dfeae4;border-radius:12px}.quiz-heading{margin:0 0 12px;color:var(--accent)}.quiz-question{padding:13px 0;border-top:1px solid #e5ece8}.quiz-question:first-of-type{border-top:0}.quiz-question p{font-weight:bold;margin:0 0 9px}.quiz-options{display:grid;gap:7px}.quiz-option{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid #e1e9e4;border-radius:8px;background:white;font-size:.88rem;cursor:pointer}.quiz-option input{margin-top:5px;accent-color:var(--accent)}.quiz-feedback{font-size:.86rem;font-weight:bold;margin-top:9px}.quiz-feedback.correct{color:#16734d}.quiz-feedback.wrong{color:#a33b32}.quiz-explanation{display:none;margin-top:11px;padding:13px 14px;border:1px solid #d9e7df;border-left:3px solid var(--gold);border-radius:10px;background:#fffdf7;font-size:.86rem}.quiz-explanation.show{display:block}.quiz-explanation h4{margin:0 0 6px;color:#8b681a}.quiz-explanation ol{margin:7px 0;padding-left:20px}.quiz-explanation li{margin:4px 0}.quiz-calculation{margin-top:8px;padding:9px 11px;border-radius:8px;background:#f0f4f1;font-family:monospace;white-space:pre-wrap}.quiz-final{margin-top:8px;color:var(--accent);font-weight:bold}.quiz-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px}.quiz-result{font-size:.85rem;font-weight:bold;color:var(--accent)}.done-label{font-size:.72rem;color:#25805f;font-weight:bold}.empty{display:none;padding:20px;text-align:center;color:var(--muted)}footer{text-align:center;padding:22px;color:var(--muted);font-size:.8rem}

<main class="wrap"><section class="intro"><small>LEARNING CENTER · KELAS XI</small><h1>Fisika</h1><p>Ringkasan konsep, rumus penting, dan latihan soal pilihan ganda dengan pembahasan untuk membantu memahami materi.</p></section>
<section class="progress-panel"><div class="progress-top"><span>Progres materi selesai</span><span><b id="doneCount">0</b> / 7 bab</span></div><div class="progress-track"><span id="progressBar"></span></div></section>
<div class="toolbar"><input id="search" type="search" placeholder="Cari bab atau materi..."><select id="filter"><option value="all">Semua bab</option><option value="todo">Belum selesai</option><option value="done">Sudah selesai</option></select><button id="openAll" type="button">Buka semua</button><button id="closeAll" type="button">Tutup semua</button></div>

const BANK = [["Vektor", "Vektor memiliki besar dan arah, sedangkan skalar hanya memiliki besar. Komponen vektor dapat diuraikan pada sumbu-x dan sumbu-y.", "Resultan dua vektor tegak lurus: R = √(Ax² + Ay²). Komponen: Ax = A cos θ dan Ay = A sin θ.", [["Besaran yang memiliki besar dan arah disebut ...", ["Skalar", "Vektor", "Pokok", "Turunan"], 1, "Vektor memiliki besar sekaligus arah.", ["Besaran vektor selalu membutuhkan nilai dan arah untuk menyatakannya.", "Contohnya perpindahan, kecepatan, dan gaya."], "Konsep: vektor = besar + arah", "Jadi, jawabannya adalah vektor."], ["Dua vektor 3 N dan 4 N saling tegak lurus. Resultannya ...", ["1 N", "5 N", "7 N", "12 N"], 1, "Gunakan teorema Pythagoras untuk vektor tegak lurus.", ["Diketahui A = 3 N dan B = 4 N.", "Karena tegak lurus, R = √(A² + B²)."], "R = √(3² + 4²) = √25 = 5 N", "Resultan kedua vektor adalah 5 N."], ["Komponen horizontal vektor A yang membentuk sudut θ terhadap sumbu-x adalah ...", ["A sin θ", "A cos θ", "A tan θ", "A/ cos θ"], 1, "Komponen pada sumbu yang berdekatan dengan sudut memakai cosinus.", ["Sudut diukur dari sumbu-x.", "Komponen horizontal merupakan sisi samping terhadap sudut."], "Ax = A cos θ", "Komponen horizontalnya adalah A cos θ."]]], ["Kinematika", "Kinematika membahas gerak tanpa meninjau penyebabnya. Gerak lurus beraturan memiliki kecepatan tetap, sedangkan gerak lurus berubah beraturan memiliki percepatan tetap.", "GLB: s = vt. GLBB: v = v₀ + at; s = v₀t + ½at²; v² = v₀² + 2as.", [["Gerak dengan kecepatan tetap disebut ...", ["GLBB", "GLB", "Gerak melingkar berubah", "Gerak parabola"], 1, "GLB memiliki kecepatan konstan dan percepatan nol.", ["Kecepatan tidak berubah terhadap waktu.", "Karena itu percepatannya nol."], "a = 0; s = vt", "Gerak tersebut adalah GLB."], ["Benda bergerak dengan kecepatan 10 m/s selama 4 s. Jaraknya ...", ["2,5 m", "14 m", "40 m", "400 m"], 2, "Pada GLB, jarak adalah kecepatan dikali waktu.", ["Diketahui v = 10 m/s dan t = 4 s.", "Gunakan s = v × t."], "s = 10 × 4 = 40 m", "Jarak yang ditempuh 40 meter."], ["Percepatan adalah perubahan ... tiap satuan waktu.", ["Posisi", "Kecepatan", "Massa", "Gaya"], 1, "Percepatan menyatakan perubahan kecepatan per waktu.", ["Bandingkan kecepatan awal dan akhir.", "Perubahan tersebut dibagi selang waktu."], "a = Δv/Δt", "Percepatan adalah perubahan kecepatan per satuan waktu."]]], ["Dinamika Gerak Partikel", "Hukum Newton menjelaskan hubungan gaya dan gerak. Resultan gaya menyebabkan percepatan, sementara gaya aksi-reaksi bekerja pada dua benda berbeda.", "ΣF = ma. Berat w = mg. Gaya gesek kinetis fk = μk N.", [["Hukum II Newton dirumuskan sebagai ...", ["F = m/a", "ΣF = ma", "p = mv", "W = Fs"], 1, "Resultan gaya sama dengan massa dikali percepatan.", ["Tentukan resultan gaya yang bekerja.", "Kalikan massa benda dengan percepatannya."], "ΣF = m a", "Rumus Hukum II Newton adalah ΣF = ma."], ["Benda bermassa 2 kg mengalami percepatan 3 m/s². Resultan gayanya ...", ["1,5 N", "5 N", "6 N", "9 N"], 2, "Gunakan Hukum II Newton.", ["Diketahui m = 2 kg dan a = 3 m/s².", "Masukkan ke persamaan ΣF = ma."], "ΣF = 2 × 3 = 6 N", "Resultan gayanya 6 N."], ["Pasangan aksi-reaksi menurut Hukum III Newton bekerja pada ...", ["Benda yang sama", "Dua benda berbeda", "Satu titik yang sama", "Benda tanpa massa"], 1, "Gaya aksi dan reaksi sama besar, berlawanan arah, dan bekerja pada benda berbeda.", ["Identifikasi benda yang memberi gaya.", "Gaya reaksi bekerja pada benda yang menerima interaksi."], "Aksi dan reaksi bekerja pada dua benda berbeda.", "Jawabannya adalah dua benda berbeda."]]], ["Fluida", "Fluida mencakup zat cair dan gas. Tekanan hidrostatis bertambah seiring kedalaman, sedangkan prinsip Archimedes berkaitan dengan gaya apung.", "P = ρgh. Gaya Archimedes FA = ρfluida g Vtercelup. Debit Q = V/t.", [["Tekanan hidrostatis dipengaruhi oleh ...", ["Warna zat cair", "Kedalaman dan massa jenis", "Bentuk wadah saja", "Luas permukaan saja"], 1, "Tekanan hidrostatis bergantung pada massa jenis, gravitasi, dan kedalaman.", ["Semakin dalam titik dari permukaan, semakin besar h.", "Massa jenis fluida juga memengaruhi tekanan."], "P = ρgh", "Tekanan hidrostatis dipengaruhi kedalaman dan massa jenis."], ["Massa jenis fluida 1000 kg/m³, g = 10 m/s², kedalaman 2 m. Tekanannya ...", ["2.000 Pa", "10.000 Pa", "20.000 Pa", "200.000 Pa"], 2, "Substitusikan nilai ke rumus tekanan hidrostatis.", ["Diketahui ρ = 1000 kg/m³, g = 10 m/s², h = 2 m.", "Gunakan P = ρgh."], "P = 1000 × 10 × 2 = 20.000 Pa", "Tekanannya 20.000 Pa."], ["Gaya ke atas pada benda dalam fluida dijelaskan oleh prinsip ...", ["Pascal", "Bernoulli", "Archimedes", "Newton"], 2, "Prinsip Archimedes menjelaskan gaya apung.", ["Fluida memberikan gaya ke atas pada benda tercelup.", "Besar gaya sama dengan berat fluida yang dipindahkan."], "FA = ρfluida g Vtercelup", "Prinsip yang dimaksud adalah Archimedes."]]], ["Gelombang", "Gelombang membawa energi tanpa memindahkan medium secara permanen. Gelombang transversal bergetar tegak lurus arah rambat, sedangkan longitudinal sejajar arah rambat.", "v = λf = λ/T. Frekuensi f = 1/T.", [["Gelombang yang arah getarnya tegak lurus arah rambat disebut ...", ["Longitudinal", "Transversal", "Mekanik longitudinal saja", "Stasioner"], 1, "Pada gelombang transversal, arah getar tegak lurus arah rambat.", ["Bayangkan gelombang pada tali.", "Tali bergerak naik-turun, sementara gelombang merambat mendatar."], "Arah getar ⟂ arah rambat", "Jenis gelombangnya adalah transversal."], ["Gelombang memiliki panjang 2 m dan frekuensi 5 Hz. Cepat rambatnya ...", ["2,5 m/s", "7 m/s", "10 m/s", "20 m/s"], 2, "Cepat rambat gelombang adalah panjang gelombang dikali frekuensi.", ["Diketahui λ = 2 m dan f = 5 Hz.", "Gunakan v = λf."], "v = 2 × 5 = 10 m/s", "Cepat rambatnya 10 m/s."], ["Banyaknya getaran tiap sekon disebut ...", ["Periode", "Amplitudo", "Frekuensi", "Panjang gelombang"], 2, "Frekuensi menyatakan jumlah getaran per detik.", ["Satuan frekuensi adalah hertz (Hz).", "Satu hertz berarti satu getaran setiap sekon."], "f = n/t", "Jawabannya adalah frekuensi."]]], ["Bunyi", "Bunyi merupakan gelombang mekanik longitudinal yang memerlukan medium. Tinggi nada berhubungan dengan frekuensi, sedangkan kuat bunyi berkaitan dengan intensitas.", "v = s/t. Gema dapat digunakan untuk mengukur jarak: d = vt/2.", [["Bunyi tidak dapat merambat melalui ...", ["Udara", "Air", "Besi", "Ruang hampa"], 3, "Bunyi memerlukan medium untuk merambat.", ["Bunyi merambat melalui getaran partikel medium.", "Ruang hampa tidak memiliki partikel yang meneruskan getaran."], "Tidak ada medium di ruang hampa.", "Bunyi tidak merambat di ruang hampa."], ["Frekuensi bunyi menentukan ...", ["Tinggi rendah nada", "Warna benda", "Massa sumber", "Jarak sumber"], 0, "Frekuensi lebih besar terdengar sebagai nada lebih tinggi.", ["Frekuensi adalah jumlah getaran per detik.", "Perubahan frekuensi mengubah tinggi nada."], "f besar → nada lebih tinggi", "Frekuensi menentukan tinggi rendah nada."], ["Bunyi pantul yang terdengar setelah bunyi asli selesai disebut ...", ["Gaung", "Gema", "Resonansi", "Interferensi"], 1, "Gema terdengar terpisah dari bunyi asli.", ["Bunyi dipantulkan oleh permukaan yang cukup jauh.", "Pantulan tiba setelah bunyi asli selesai."], "Pantulan terdengar terpisah dari bunyi asli.", "Peristiwa tersebut disebut gema."]]], ["Cahaya", "Cahaya adalah gelombang elektromagnetik yang dapat merambat di ruang hampa. Pemantulan dan pembiasan menjelaskan banyak peristiwa optik.", "Hukum pemantulan: sudut datang = sudut pantul. Indeks bias n = c/v.", [["Cahaya dapat merambat di ruang hampa karena ...", ["Memerlukan udara", "Merupakan gelombang elektromagnetik", "Selalu dipantulkan", "Tidak membawa energi"], 1, "Gelombang elektromagnetik tidak memerlukan medium.", ["Cahaya termasuk gelombang elektromagnetik.", "Karena itu cahaya Matahari dapat mencapai Bumi melalui ruang angkasa."], "Cahaya tidak memerlukan medium.", "Cahaya merupakan gelombang elektromagnetik."], ["Jika sudut datang 35°, sudut pantul adalah ...", ["25°", "35°", "55°", "70°"], 1, "Hukum pemantulan menyatakan sudut datang sama dengan sudut pantul.", ["Diketahui sudut datang = 35°.", "Gunakan i = r."], "r = i = 35°", "Sudut pantulnya 35°."], ["Pembelokan arah cahaya saat melewati dua medium berbeda disebut ...", ["Pemantulan", "Difraksi", "Pembiasan", "Dispersi"], 2, "Pembiasan terjadi akibat perubahan cepat rambat cahaya saat berpindah medium.", ["Cahaya memasuki medium dengan indeks bias berbeda.", "Kecepatan dan arah rambatnya dapat berubah."], "Peristiwa ini disebut refraksi.", "Jawabannya adalah pembiasan."]]]];
const STORAGE_KEY = "materi-fisika-xi-v2";
const letters = ["A","B","C","D"];
const container = document.getElementById("chapters");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function quizMarkup(chapter,index){
 const questions=chapter[3];
 return `<section class="quiz"><h3 class="quiz-heading">Latihan Soal · ${esc(chapter[0])}</h3>
 ${questions.map((q,qi)=>`<div class="quiz-question" data-q="${qi}">
 <p>${qi+1}. ${esc(q[0])}</p><div class="quiz-options">${q[1].map((op,oi)=>`<label class="quiz-option"><input type="radio" name="q-${index}-${qi}" value="${oi}"><span><b>${letters[oi]}.</b> ${esc(op)}</span></label>`).join("")}</div>
 <div class="quiz-feedback" aria-live="polite"></div><div class="quiz-explanation"></div></div>`).join("")}
 <div class="quiz-actions"><button class="primary" type="button" data-check="${index}">Periksa Jawaban</button><button type="button" data-reset="${index}">Ulangi</button><span class="quiz-result" aria-live="polite"></span></div></section>`;
}
function render(){
 container.innerHTML=BANK.map((ch,i)=>`<details class="chapter" data-chapter="${i}" ${i===0?"open":""}>
 <summary><span>${i+1}. ${esc(ch[0])}</span><span class="done-label" data-done="${i}"></span></summary>
 <div class="chapter-body"><p>${esc(ch[1])}</p><div class="formula">${esc(ch[2])}</div>${quizMarkup(ch,i)}</div></details>`).join("");
 updateProgress();
}
function readDone(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(x)?x:[]}catch{return []}}
function updateProgress(){
 const done=readDone();const count=document.getElementById("doneCount");
 count.textContent=done.length;document.getElementById("progressBar").style.width=(done.length/BANK.length*100)+"%";
 BANK.forEach((_,i)=>{const el=document.querySelector(`[data-done="${i}"]`);if(el)el.textContent=done.includes(i)?"✓ Selesai":"";});
}
function saveDone(i){const done=readDone();if(!done.includes(i)){done.push(i);localStorage.setItem(STORAGE_KEY,JSON.stringify(done));}updateProgress();}
function showExplanation(el,q){
 const panel=el.querySelector(".quiz-explanation");
 panel.innerHTML=`<h4>Pembahasan jawaban</h4><ol>${q[4].map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="quiz-calculation">${esc(q[5])}</div><div class="quiz-final">${esc(q[6])}</div>`;
 panel.classList.add("show");
}
document.addEventListener("click",e=>{
 const check=e.target.closest("[data-check]");
 if(check){
  const idx=Number(check.dataset.check),chapter=BANK[idx],questions=chapter[3],card=document.querySelector(`[data-chapter="${idx}"]`);
  let score=0,answered=0;
  questions.forEach((q,qi)=>{
   const row=card.querySelector(`[data-q="${qi}"]`),picked=row.querySelector("input:checked"),feedback=row.querySelector(".quiz-feedback");
   if(!picked){feedback.textContent="Pilih salah satu jawaban terlebih dahulu.";feedback.className="quiz-feedback";return;}
   answered++;const chosen=Number(picked.value);row.querySelectorAll("input").forEach(x=>x.disabled=true);
   if(chosen===q[2]){score++;feedback.textContent="Benar! "+q[3];feedback.className="quiz-feedback correct";}
   else{feedback.textContent=`Belum tepat. Jawaban benar: ${letters[q[2]]}. ${q[3]}`;feedback.className="quiz-feedback wrong";showExplanation(row,q);}
  });
  const result=card.querySelector(".quiz-result");
  if(answered===questions.length){result.textContent=`Skor: ${score}/${questions.length}`;saveDone(idx);check.disabled=true;}
  else result.textContent=`${answered}/${questions.length} soal terjawab`;
 }
 const reset=e.target.closest("[data-reset]");
 if(reset){
  const idx=Number(reset.dataset.reset),card=document.querySelector(`[data-chapter="${idx}"]`);
  card.querySelectorAll("input").forEach(x=>{x.checked=false;x.disabled=false;});
  card.querySelectorAll(".quiz-feedback").forEach(x=>{x.textContent="";x.className="quiz-feedback";});
  card.querySelectorAll(".quiz-explanation").forEach(x=>{x.innerHTML="";x.classList.remove("show");});
  card.querySelector(".quiz-result").textContent="";
  card.querySelector("[data-check]").disabled=false;
 }
});
document.getElementById("search").addEventListener("input",filterChapters);
document.getElementById("filter").addEventListener("change",filterChapters);
function filterChapters(){
 const term=document.getElementById("search").value.toLowerCase(),mode=document.getElementById("filter").value;
 document.querySelectorAll(".chapter").forEach((el,i)=>{
  const match=(BANK[i][0]+" "+BANK[i][1]).toLowerCase().includes(term);
  const isDone=readDone().includes(i);
  el.style.display=match&&(mode==="all"||(mode==="done"&&isDone)||(mode==="todo"&&!isDone))?"":"none";
 });
}
document.getElementById("openAll").addEventListener("click",()=>document.querySelectorAll(".chapter").forEach(x=>x.open=true));
document.getElementById("closeAll").addEventListener("click",()=>document.querySelectorAll(".chapter").forEach(x=>x.open=false));
render();
</script></body></html>
