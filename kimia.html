*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;line-height:1.65}a{color:inherit}.site-head{background:#123b32;color:#fff;padding:17px max(5%,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.site-head a{text-decoration:none;font-weight:bold}.back{font-size:.85rem;color:#d5e9df}.wrap{width:min(1050px,90%);margin:32px auto 70px}.intro{padding:30px;border-radius:18px;background:linear-gradient(120deg,#123b32,#28765f);color:white;margin-bottom:22px}.intro small{color:#d8c27d;letter-spacing:1.5px;font-weight:bold}.intro h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:8px 0}.intro p{color:#e2eee8;margin:0;max-width:680px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.toolbar button,.quiz-actions button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:white;color:var(--ink)}.toolbar input{flex:1;min-width:190px}.toolbar button,.quiz-actions button{cursor:pointer;font-weight:bold}.toolbar button.primary,.quiz-actions button.primary{background:var(--accent);color:white;border-color:var(--accent)}.progress-panel{background:white;border:1px solid var(--line);border-radius:13px;padding:14px 17px;margin-bottom:18px}.progress-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:bold}.progress-track{height:8px;background:#e8efeb;border-radius:10px;overflow:hidden;margin-top:9px}.progress-track span{display:block;height:100%;width:0;background:#3c9b78;transition:width .3s}.chapter{background:white;border:1px solid var(--line);border-radius:14px;margin:13px 0;overflow:hidden}.chapter summary{padding:17px 20px;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;gap:12px;list-style:none}.chapter summary::-webkit-details-marker{display:none}.chapter summary:after{content:"＋";color:var(--accent)}.chapter[open] summary:after{content:"−"}.chapter-body{padding:0 20px 20px;border-top:1px solid var(--line)}.chapter-body h3{font-size:1rem;margin:17px 0 5px;color:var(--accent)}.chapter-body p,.chapter-body li{font-size:.91rem}.formula{background:#f0f7f3;padding:12px 15px;border-left:3px solid var(--accent);border-radius:7px;margin:12px 0;font-family:Georgia,serif}.quiz{margin-top:20px;padding:17px;background:#f8fbf9;border:1px solid #dfeae4;border-radius:12px}.quiz-heading{margin:0 0 12px;color:var(--accent)}.quiz-question{padding:13px 0;border-top:1px solid #e5ece8}.quiz-question:first-of-type{border-top:0}.quiz-question p{font-weight:bold;margin:0 0 9px}.quiz-options{display:grid;gap:7px}.quiz-option{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid #e1e9e4;border-radius:8px;background:white;font-size:.88rem;cursor:pointer}.quiz-option input{margin-top:5px;accent-color:var(--accent)}.quiz-feedback{font-size:.86rem;font-weight:bold;margin-top:9px}.quiz-feedback.correct{color:#16734d}.quiz-feedback.wrong{color:#a33b32}.quiz-explanation{display:none;margin-top:11px;padding:13px 14px;border:1px solid #d9e7df;border-left:3px solid var(--gold);border-radius:10px;background:#fffdf7;font-size:.86rem}.quiz-explanation.show{display:block}.quiz-explanation h4{margin:0 0 6px;color:#8b681a}.quiz-explanation ol{margin:7px 0;padding-left:20px}.quiz-explanation li{margin:4px 0}.quiz-calculation{margin-top:8px;padding:9px 11px;border-radius:8px;background:#f0f4f1;font-family:monospace;white-space:pre-wrap}.quiz-final{margin-top:8px;color:var(--accent);font-weight:bold}.quiz-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px}.quiz-result{font-size:.85rem;font-weight:bold;color:var(--accent)}.done-label{font-size:.72rem;color:#25805f;font-weight:bold}.empty{display:none;padding:20px;text-align:center;color:var(--muted)}footer{text-align:center;padding:22px;color:var(--muted);font-size:.8rem}

<main class="wrap"><section class="intro"><small>LEARNING CENTER · KELAS XI</small><h1>Kimia</h1><p>Ringkasan konsep, rumus penting, dan latihan soal pilihan ganda dengan pembahasan langkah demi langkah.</p></section>
<section class="progress-panel"><div class="progress-top"><span>Progres materi selesai</span><span><b id="doneCount">0</b> / 7 bab</span></div><div class="progress-track"><span id="progressBar"></span></div></section>

<script>
const BANK = [["Struktur Atom dan Sistem Periodik", "Atom tersusun atas proton, neutron, dan elektron. Nomor atom menunjukkan jumlah proton, sedangkan nomor massa merupakan jumlah proton dan neutron. Tabel periodik mengelompokkan unsur berdasarkan kemiripan sifat.", "Z = jumlah proton. A = proton + neutron. Atom netral: proton = elektron.", [["Partikel subatom yang memiliki muatan negatif adalah ...", ["Proton", "Elektron", "Neutron", "Nukleus"], 1, "Elektron bermuatan negatif.", ["Proton bermuatan positif.", "Neutron tidak bermuatan.", "Elektron memiliki muatan negatif."], "Muatan elektron = −1", "Partikel yang dimaksud adalah elektron."], ["Nomor atom (Z) menunjukkan jumlah ...", ["Neutron", "Proton", "Proton dan neutron", "Kulit elektron"], 1, "Nomor atom ditentukan oleh jumlah proton.", ["Setiap unsur memiliki jumlah proton yang khas.", "Nilai itulah yang disebut nomor atom."], "Z = jumlah proton", "Nomor atom menunjukkan jumlah proton."], ["Atom netral memiliki jumlah proton yang ... jumlah elektronnya.", ["Lebih banyak", "Lebih sedikit", "Sama", "Tidak berkaitan"], 2, "Muatan positif proton harus diimbangi muatan negatif elektron.", ["Atom netral memiliki muatan total nol.", "Jumlah proton dan elektron harus sama."], "p⁺ = e⁻", "Jumlah proton sama dengan jumlah elektronnya."]]], ["Ikatan Kimia", "Ikatan kimia terbentuk karena interaksi elektron valensi. Ikatan ion terjadi melalui perpindahan elektron, ikatan kovalen melalui pemakaian bersama pasangan elektron, dan ikatan logam melibatkan elektron yang terdelokalisasi.", "Ion positif terbentuk saat melepas elektron; ion negatif terbentuk saat menerima elektron.", [["Ikatan ion terbentuk terutama karena ...", ["Pemakaian pasangan elektron bersama", "Perpindahan elektron dan tarik-menarik ion", "Penggabungan inti atom", "Pembentukan neutron"], 1, "Ikatan ion melibatkan pembentukan kation dan anion.", ["Satu atom melepas elektron sehingga menjadi kation.", "Atom lain menerima elektron sehingga menjadi anion.", "Muatan berlawanan saling tarik-menarik."], "Logam → melepas e⁻; nonlogam → menerima e⁻", "Ikatan ion terbentuk melalui perpindahan elektron dan tarik-menarik ion."], ["Ikatan kovalen terbentuk ketika atom-atom ...", ["Berbagi pasangan elektron", "Melepaskan proton", "Membentuk neutron", "Menghilangkan semua elektron"], 0, "Ikatan kovalen menggunakan pasangan elektron bersama.", ["Atom-atom, umumnya nonlogam, membutuhkan kestabilan elektron.", "Mereka menggunakan satu atau lebih pasangan elektron bersama."], "Pasangan elektron digunakan bersama.", "Jawabannya adalah berbagi pasangan elektron."], ["Ikatan logam melibatkan ion logam dan ...", ["Molekul air", "Elektron valensi yang relatif bebas bergerak", "Neutron bebas", "Gas mulia"], 1, "Elektron valensi terdelokalisasi membantu menjelaskan sifat logam.", ["Atom logam melepaskan sebagian elektron valensinya.", "Elektron tersebut dapat bergerak di antara ion-ion logam."], "Model ikatan logam: kation logam + elektron terdelokalisasi.", "Ikatan logam melibatkan elektron valensi yang relatif bebas bergerak."]]], ["Stoikiometri", "Stoikiometri mempelajari hubungan kuantitatif antarzat dalam reaksi kimia. Persamaan reaksi harus setara sebelum digunakan untuk menghitung jumlah zat.", "n = m/Mr; N = n × 6,022 × 10²³; konsentrasi molar M = n/V (V dalam liter).", [["Satu mol zat mengandung sekitar ... partikel.", ["6,022 × 10²³", "3,14 × 10⁸", "9,8 × 10²", "1,0 × 10⁻³"], 0, "Bilangan Avogadro menyatakan jumlah partikel dalam satu mol.", ["Satu mol mengandung jumlah partikel yang tetap.", "Nilai tetapan Avogadro sekitar 6,022 × 10²³."], "Nₐ = 6,022 × 10²³ partikel/mol", "Satu mol mengandung sekitar 6,022 × 10²³ partikel."], ["Jika massa zat m dan massa molar M, jumlah mol n adalah ...", ["n = m × M", "n = M / m", "n = m / M", "n = m + M"], 2, "Jumlah mol diperoleh dengan membagi massa oleh massa molar.", ["Catat massa zat dalam gram.", "Bagi massa dengan massa molar dalam g/mol."], "n = m/M", "Rumus jumlah mol adalah n = m/M."], ["Persamaan reaksi disetarakan agar ...", ["Warna zat sama", "Jumlah atom tiap unsur sama di kedua sisi", "Reaksi selalu lebih cepat", "Semua koefisien satu"], 1, "Penyetaraan mengikuti hukum kekekalan massa.", ["Atom tidak diciptakan atau dimusnahkan dalam reaksi kimia biasa.", "Karena itu jumlah atom setiap unsur harus sama pada kedua sisi."], "Jumlah atom reaktan = jumlah atom produk", "Persamaan disetarakan agar jumlah atom tiap unsur sama."]]], ["Hidrokarbon", "Hidrokarbon hanya tersusun dari karbon dan hidrogen. Alkana memiliki ikatan tunggal, alkena memiliki ikatan rangkap dua, dan alkuna memiliki ikatan rangkap tiga.", "Alkana: CₙH₂ₙ₊₂; alkena rantai terbuka: CₙH₂ₙ; alkuna rantai terbuka: CₙH₂ₙ₋₂.", [["Hidrokarbon hanya tersusun dari unsur ...", ["Karbon dan oksigen", "Karbon dan hidrogen", "Hidrogen dan nitrogen", "Karbon dan belerang"], 1, "Kata hidrokarbon merujuk pada senyawa karbon dan hidrogen.", ["Identifikasi unsur penyusun senyawanya.", "Hidrokarbon tidak mengandung unsur lain sebagai penyusun utamanya."], "Unsur penyusun: C dan H", "Hidrokarbon tersusun dari karbon dan hidrogen."], ["Hidrokarbon jenuh dengan ikatan tunggal disebut ...", ["Alkena", "Alkuna", "Alkana", "Alkohol"], 2, "Alkana merupakan hidrokarbon jenuh dengan ikatan tunggal C–C.", ["Periksa jenis ikatan antarkarbon.", "Ikatan tunggal menandakan golongan alkana."], "Golongan: alkana", "Jawabannya adalah alkana."], ["Rumus umum alkana rantai terbuka adalah ...", ["CₙH₂ₙ₊₂", "CₙH₂ₙ", "CₙH₂ₙ₋₂", "CₙHₙ"], 0, "Alkana rantai terbuka memiliki rumus umum CnH2n+2.", ["Gunakan rumus umum deret homolog alkana.", "Masukkan jumlah atom karbon n jika ingin menentukan rumus molekul."], "CₙH₂ₙ₊₂", "Rumus umum alkana adalah CₙH₂ₙ₊₂."]]], ["Termokimia", "Termokimia mempelajari perubahan kalor dalam reaksi. Reaksi eksoterm melepaskan kalor, sedangkan endoterm menyerap kalor.", "q = m c ΔT. Eksoterm: ΔH negatif. Endoterm: ΔH positif.", [["Reaksi eksoterm adalah reaksi yang ...", ["Menyerap kalor", "Melepaskan kalor ke lingkungan", "Tidak mengalami perubahan energi", "Selalu membutuhkan katalis"], 1, "Eksoterm melepaskan kalor ke lingkungan.", ["Energi berpindah dari sistem menuju lingkungan.", "Entalpi sistem berkurang."], "ΔH < 0", "Reaksi eksoterm melepaskan kalor ke lingkungan."], ["Pada reaksi endoterm, nilai ΔH adalah ...", ["Negatif", "Positif", "Selalu nol", "Tidak memiliki tanda"], 1, "Endoterm menyerap energi sehingga entalpi sistem meningkat.", ["Kalor masuk ke dalam sistem.", "Perubahan entalpi bernilai positif."], "ΔH > 0", "Nilai ΔH reaksi endoterm adalah positif."], ["Rumus kalor untuk perubahan suhu adalah ...", ["q = m c ΔT", "q = m / c", "q = c / m", "q = m + c + ΔT"], 0, "Kalor bergantung pada massa, kalor jenis, dan perubahan suhu.", ["Tentukan massa zat dan kalor jenisnya.", "Hitung perubahan suhu akhir dikurangi suhu awal.", "Kalikan ketiga besaran."], "q = m × c × (Takhir − Tawal)", "Rumusnya adalah q = mcΔT."]]], ["Laju Reaksi", "Laju reaksi menyatakan perubahan konsentrasi pereaksi atau produk tiap satuan waktu. Faktor yang memengaruhi laju antara lain konsentrasi, suhu, luas permukaan, tekanan gas, dan katalis.", "Laju rata-rata = perubahan konsentrasi / perubahan waktu. Katalis menurunkan energi aktivasi.", [["Laju reaksi menyatakan perubahan ... per satuan waktu.", ["Warna", "Konsentrasi pereaksi atau produk", "Massa inti atom", "Nomor atom"], 1, "Laju reaksi berkaitan dengan perubahan konsentrasi terhadap waktu.", ["Amati konsentrasi pereaksi yang berkurang atau produk yang bertambah.", "Perubahan tersebut dibandingkan dengan selang waktu."], "v = Δkonsentrasi/Δt", "Laju reaksi menyatakan perubahan konsentrasi per satuan waktu."], ["Kenaikan suhu umumnya mempercepat reaksi karena ...", ["Partikel berhenti bergerak", "Energi kinetik partikel meningkat", "Jumlah atom berubah", "Katalis selalu terbentuk"], 1, "Suhu lebih tinggi meningkatkan energi kinetik rata-rata partikel.", ["Partikel bergerak lebih cepat.", "Tumbukan terjadi lebih sering dan lebih banyak tumbukan efektif."], "Suhu naik → energi kinetik naik → laju reaksi cenderung naik", "Kenaikan suhu meningkatkan energi kinetik partikel."], ["Katalis mempercepat reaksi dengan cara ...", ["Menaikkan energi aktivasi", "Mengubah nomor atom", "Menyediakan jalur dengan energi aktivasi lebih rendah", "Mengubah pereaksi seketika"], 2, "Katalis menyediakan mekanisme reaksi alternatif dengan energi aktivasi lebih rendah.", ["Katalis tidak mengubah identitas akhir produk.", "Katalis menyediakan jalur reaksi alternatif.", "Energi aktivasi jalur tersebut lebih rendah."], "Ea dengan katalis < Ea tanpa katalis", "Katalis menurunkan energi aktivasi."]]], ["Kesetimbangan Kimia", "Kesetimbangan dinamis terjadi saat laju reaksi maju sama dengan laju reaksi balik. Menurut asas Le Chatelier, sistem merespons perubahan dengan mengurangi pengaruh gangguan.", "Untuk aA + bB ⇌ cC + dD, Kc = [C]ᶜ[D]ᵈ/[A]ᵃ[B]ᵇ.", [["Kesetimbangan dinamis tercapai ketika ...", ["Semua reaktan habis", "Laju reaksi maju sama dengan laju balik", "Reaksi berhenti total", "Konsentrasi semua zat sama"], 1, "Kesetimbangan bersifat dinamis: reaksi tetap berlangsung dua arah.", ["Reaksi maju tetap berlangsung.", "Reaksi balik juga tetap berlangsung.", "Pada kesetimbangan, kedua lajunya sama."], "v maju = v balik", "Kesetimbangan dinamis terjadi saat laju maju sama dengan laju balik."], ["Jika konsentrasi pereaksi ditambah, sistem cenderung bergeser untuk ...", ["Mengurangi pengaruh penambahan tersebut", "Menghentikan reaksi", "Menghilangkan katalis", "Mengubah nomor atom"], 0, "Sistem merespons dengan mengonsumsi sebagian zat yang ditambahkan.", ["Penambahan pereaksi merupakan gangguan.", "Sistem cenderung membentuk lebih banyak produk untuk mengurangi gangguan tersebut."], "Penambahan reaktan → bergeser ke arah produk", "Sistem bergeser untuk mengurangi pengaruh penambahan pereaksi."], ["Apa pengaruh katalis terhadap posisi kesetimbangan?", ["Menggeser ke kanan", "Menggeser ke kiri", "Tidak mengubah posisi kesetimbangan", "Mengubah nilai K"], 2, "Katalis mempercepat tercapainya kesetimbangan tanpa mengubah komposisi setimbang.", ["Katalis mempercepat reaksi maju dan balik.", "Kedua arah dipercepat sehingga posisi kesetimbangan tidak berubah."], "Katalis tidak mengubah K maupun posisi kesetimbangan.", "Katalis tidak mengubah posisi kesetimbangan."]]]];
const STORAGE_KEY = "materi-kimia-xi-v1";
const letters = ["A","B","C","D"];
const container = document.getElementById("chapters");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function quizMarkup(chapter,index){
 const questions=chapter[3];
 return `<section class="quiz"><h3 class="quiz-heading">Latihan Soal · ${esc(chapter[0])}</h3>
 ${questions.map((q,qi)=>`<div class="quiz-question" data-q="${qi}">
 <p>${qi+1}. ${esc(q[0])}</p><div class="quiz-options">${q[1].map((op,oi)=>`<label class="quiz-option"><input type="radio" name="q-${index}-${qi}" value="${oi}"><span><b>${letters[oi]}.</b> ${esc(op)}</span></label>`).join("")}</div>
 <div class="quiz-feedback" aria-live="polite"></div><div class="quiz-explanation"></div></div>`).join("")}
 <div class="quiz-actions"><button class="primary" type="button" data-check="${index}">Periksa Jawaban</button><button type="button" data-reset="${index}">Ulangi</button><span class="quiz-result" aria-live="polite"></span></div></section>`;
}
function render(){
 container.innerHTML=BANK.map((ch,i)=>`<details class="chapter" data-chapter="${i}" ${i===0?"open":""}>
 <summary><span>${i+1}. ${esc(ch[0])}</span><span class="done-label" data-done="${i}"></span></summary>
 <div class="chapter-body"><p>${esc(ch[1])}</p><div class="formula">${esc(ch[2])}</div>${quizMarkup(ch,i)}</div></details>`).join("");
 updateProgress();
}
function readDone(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(x)?x:[]}catch{return []}}
function updateProgress(){
 const done=readDone();const count=document.getElementById("doneCount");
 count.textContent=done.length;document.getElementById("progressBar").style.width=(done.length/BANK.length*100)+"%";
 BANK.forEach((_,i)=>{const el=document.querySelector(`[data-done="${i}"]`);if(el)el.textContent=done.includes(i)?"✓ Selesai":"";});
}
function saveDone(i){const done=readDone();if(!done.includes(i)){done.push(i);localStorage.setItem(STORAGE_KEY,JSON.stringify(done));}updateProgress();}
function showExplanation(el,q){
 const panel=el.querySelector(".quiz-explanation");
 panel.innerHTML=`<h4>Pembahasan jawaban</h4><ol>${q[4].map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="quiz-calculation">${esc(q[5])}</div><div class="quiz-final">${esc(q[6])}</div>`;
 panel.classList.add("show");
}
document.addEventListener("click",e=>{
 const check=e.target.closest("[data-check]");
 if(check){
  const idx=Number(check.dataset.check),chapter=BANK[idx],questions=chapter[3],card=document.querySelector(`[data-chapter="${idx}"]`);
  let score=0,answered=0;
  questions.forEach((q,qi)=>{
   const row=card.querySelector(`[data-q="${qi}"]`),picked=row.querySelector("input:checked"),feedback=row.querySelector(".quiz-feedback");
   if(!picked){feedback.textContent="Pilih salah satu jawaban terlebih dahulu.";feedback.className="quiz-feedback";return;}
   answered++;const chosen=Number(picked.value);row.querySelectorAll("input").forEach(x=>x.disabled=true);
   if(chosen===q[2]){score++;feedback.textContent="Benar! "+q[3];feedback.className="quiz-feedback correct";}
   else{feedback.textContent=`Belum tepat. Jawaban benar: ${letters[q[2]]}. ${q[3]}`;feedback.className="quiz-feedback wrong";showExplanation(row,q);}
  });
  const result=card.querySelector(".quiz-result");
  if(answered===questions.length){result.textContent=`Skor: ${score}/${questions.length}`;saveDone(idx);check.disabled=true;}
  else result.textContent=`${answered}/${questions.length} soal terjawab`;
 }
 const reset=e.target.closest("[data-reset]");
 if(reset){
  const idx=Number(reset.dataset.reset),card=document.querySelector(`[data-chapter="${idx}"]`);
  card.querySelectorAll("input").forEach(x=>{x.checked=false;x.disabled=false;});
  card.querySelectorAll(".quiz-feedback").forEach(x=>{x.textContent="";x.className="quiz-feedback";});
  card.querySelectorAll(".quiz-explanation").forEach(x=>{x.innerHTML="";x.classList.remove("show");});
  card.querySelector(".quiz-result").textContent="";
  card.querySelector("[data-check]").disabled=false;
 }
});
document.getElementById("search").addEventListener("input",filterChapters);
document.getElementById("filter").addEventListener("change",filterChapters);
function filterChapters(){
 const term=document.getElementById("search").value.toLowerCase(),mode=document.getElementById("filter").value;
 document.querySelectorAll(".chapter").forEach((el,i)=>{
  const match=(BANK[i][0]+" "+BANK[i][1]).toLowerCase().includes(term);
  const isDone=readDone().includes(i);
  el.style.display=match&&(mode==="all"||(mode==="done"&&isDone)||(mode==="todo"&&!isDone))?"":"none";
 });
}
document.getElementById("openAll").addEventListener("click",()=>document.querySelectorAll(".chapter").forEach(x=>x.open=true));
document.getElementById("closeAll").addEventListener("click",()=>document.querySelectorAll(".chapter").forEach(x=>x.open=false));
render();
</script></body></html>
